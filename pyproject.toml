[project]
name = "sol-torch-kernels"
version = "0.0.1"
description = "Speed-of-light PyTorch op kernels in CuTe DSL for NVIDIA Blackwell (sm120)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nvidia-cutlass-dsl>=4.3.5",
    "nvidia-ml-py>=13.610.43",
    "torch>=2.10.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sol_kernels", "src/sol_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
