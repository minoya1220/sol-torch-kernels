# CPU CI on every PR (docs/eval-design.md 8.3): the static lint of impl files and
# the harness unit tests, which include the static exploits in lint mode.
# Normal pull_request trigger, read-only token, no secrets.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Install the locked environment
        run: uv sync --frozen
      - name: Static lint of impl files (design 2.2)
        run: uv run python -m sol_eval.integrity.lint

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Install the locked environment
        run: uv sync --frozen
      - name: Harness unit tests (CPU)
        run: uv run pytest -ra
